  common: "primitive 2-atom fcc cell a = 3.567 A (vectors (0,h,h),(h,0,h),(h,h,0), h = 1.7835 A), atoms at reduced (0.05,0.05,0.05) and (0.30,0.30,0.30), xc PZ, nelec 8, nstate 8, fixed occupations (temperature_k not set), yn_symmetry n, ncg 4, nscf 800, threshold 1d-9, broyden mixing, shifted Monkhorst-Pack n x n x n mesh without symmetry reduction, DOS -24..+10 eV 2721 points gaussian 0.1 eV with the valence-band maximum as the origin, write_gs_restart_data no"
  ladders:
    - name: "num_rgrid r,r,r at k6 (6 nodes each)"
      points: "16, 20, 24, 28, 32, 36, 40, 48"
    - name: "k mesh n x n x n at r32"
      points: "6 (= the r32 rung above), 8, 10, 12, 16, 20, 24"
  all_runs_converged: "yes (SCF residual below threshold, well below the nscf cap of 800)"
raw_outputs: "not committed; figures are derived from the *_dos.data files and the standard output of the runs above"
